name: cazador
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gwpy
  - gwosc
  - numpy
  - scipy
  - matplotlib
  - libblas=*=*openblas  # evita MKL: en Windows chocaba con las DLL de anaconda base y tumbaba el kernel
  - jupyterlab
  - ipykernel
  - nbstripout
  - pip
  - pip:
      - jax==0.12.0.1
      - jaxlib==0.12.0.1
      - ripplegw==0.5.0
